<section id="log" class="mod" data-show="$epic == ''"><h2>Events<small>newest first</small></h2><div class="scroll">{{#events}}<div class="ev {{kind}} {{age}}" id="{{id}}" style="--hue:{{hue}}" {{> hover}}><time>{{clock}}</time>{{> tag}}<span class="what"><span class="verb">{{verb}}</span>{{#path}} <span class="path">{{.}}</span>{{/path}}{{#text}} {{.}}{{/text}}{{#more}} <span class="more">and {{.}} more</span>{{/more}}</span></div>{{/events}}{{^events}}<p class="empty">No events in the window.</p>{{/events}}</div></section>
