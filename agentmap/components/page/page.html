<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>agentmap</title><link rel="stylesheet" href="/static/app.css"><script type="module" src="/static/datastar.js"></script></head>
<body{{#dark}} class="dark"{{/dark}} data-signals="{focus: '', hue: '', epic: '', peek: '', pin: '', pinat: '', stale: false, now: Date.now() / 1000}" data-init="@get('/stream', {openWhenHidden: true}); setInterval(() =&gt; $now = Date.now() / 1000, 10000)" data-style:--focus-hue="$hue" data-class:dark="new Date($now * 1000).getHours() &lt; {{light_from}} || new Date($now * 1000).getHours() &gt;= {{dark_from}}">
{{{app}}}
{{{tickets}}}
{{{epics}}}
<aside id="peek" class="peek" data-class:open="$pin != '' || $peek != ''" data-class:pinned="$pin != ''" data-on:keydown__window="evt.key == 'Escape' &amp;&amp; ($pin = '', $pinat = '')"></aside>
</body></html>
