<button class="epic {{age}}" id="{{key}}" {{> link}} data-on:click="$epic = $epic == '{{key}}' ? '' : '{{key}}'" data-class:sel="$epic == '{{key}}'"><span class="ep-head">{{#id}}<span class="ep-id">{{.}}</span>{{/id}}{{#has_priority}}<span class="prio p{{priority}}">P{{priority}}</span>{{/has_priority}}{{#agents.0}}<span class="agents">{{#agents}}{{{.}}}{{/agents}}</span>{{/agents.0}}<span class="changed">changed {{changed}}</span></span><span class="ep-title">{{title}}</span>{{#tags}}<span class="tags">{{.}}</span>{{/tags}}<span class="bar"><span class="done" style="width:{{done_pct}}%"></span><span class="active" style="width:{{active_pct}}%"></span></span><span class="counts"><b>{{in_progress}}</b> in progress · {{ready}} ready · {{blocked}} blocked · {{closed}} closed</span>{{#now.0}}<span class="ep-now">{{#now}}<span class="now-item" {{> link}}><span class="tk-id">{{id}}</span>{{#agents}}{{{.}}}{{/agents}}<span class="now-title">{{title}}</span></span>{{/now}}{{#more}}<span class="now-more">and {{.}} more</span>{{/more}}</span>{{/now.0}}</button>
