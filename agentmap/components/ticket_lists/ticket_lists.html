<div id="tickets">{{#lists}}<section class="mod tickets" id="{{key}}" data-show="$epic == '{{key}}'" style="display:none"><h2>{{#id}}<span class="ep-id">{{.}}</span>{{/id}}<span class="list-title">{{title}}</span><small>{{count}}</small>{{> close}}</h2><div class="scroll tiers">{{#tiers}}<section class="tier {{name}}"><h3 class="tier-head">{{label}}</h3>{{#rows}}{{{.}}}{{/rows}}</section>{{/tiers}}{{#stale}}<section class="tier stale"><button class="fold" data-on:click="$stale = !$stale">{{label}}</button><div data-show="$stale" style="display:none">{{#rows}}{{{.}}}{{/rows}}</div></section>{{/stale}}</div></section>{{/lists}}<section class="mod tickets" data-show="$epic != '' &amp;&amp; !{{keys}}.includes($epic)" style="display:none"><h2>Tickets{{> close}}</h2><p class="empty">This epic has no ticket in progress now.</p></section></div>
