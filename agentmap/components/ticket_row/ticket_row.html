<article class="tk {{state}} {{age}}" id="{{dom}}"><button class="tk-head" data-on:click="$ticket = $ticket == '{{dom}}' ? '' : '{{dom}}'; $ticket == '{{dom}}' &amp;&amp; @get('/ticket/{{url}}')" data-class:open="$ticket == '{{dom}}'" {{> peek}}><span class="tk-meta"><span class="mark"></span><span class="tk-id">{{id}}</span><span class="prio p{{priority}}">P{{priority}}</span><span class="type">{{type}}</span>{{#blocked}}<span class="blockers">blocked by {{.}}</span>{{/blocked}}{{#agents}}{{{.}}}{{/agents}}{{#notes}}<span class="notes {{notes_age}}">{{.}}</span>{{/notes}}{{#tags}}<span class="tags">{{.}}</span>{{/tags}}</span><span class="tk-title">{{title}}</span></button><div class="tk-body" id="tb-{{dom}}" data-ignore-morph data-show="$ticket == '{{dom}}'" style="display:none"></div></article>
