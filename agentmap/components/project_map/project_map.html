<section id="map" class="mod"><h2>Map<small>route: newest files, ink: age</small></h2><div class="map-box">{{#cells}}<div class="cell d{{depth}}{{#line_l}} line-l{{/line_l}}{{#line_t}} line-t{{/line_t}}{{#busy}} busy{{/busy}}{{#parent}} parent{{/parent}}" id="{{id}}" data-cell="{{key}}" style="left:{{x}}%;top:{{y}}%;width:{{w}}%;height:{{h}}%" {{> link}}><span class="label">{{label}}</span></div>{{/cells}}{{^cells}}<p class="empty">No files to map.</p>{{/cells}}<svg class="routes" viewBox="0 0 1080 600" preserveAspectRatio="none" aria-hidden="true">{{#routes}}<g style="--hue:{{hue}}" data-class:hl="$focus.includes(' {{tag}} ')">{{#segments}}<path class="route{{#now}} now{{/now}}" d="{{d}}" {{> fade}}/>{{/segments}}{{#stops}}<circle class="stop" cx="{{x}}" cy="{{y}}" r="5" {{> fade}}/>{{/stops}}</g>{{/routes}}</svg>{{#dots}}<span {{> hover}} class="dot {{state}}" style="--hue:{{hue}};left:{{x}}%;top:{{y}}%">{{tag}}</span>{{/dots}}</div></section>
