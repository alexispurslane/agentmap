<section id="map" class="mod"><h2>Map<small>route: newest files, ink: age</small></h2><div class="map-box">{{#cells}}<div class="cell d{{depth}}{{#busy}} busy{{/busy}}" id="{{id}}" data-cell="{{key}}" style="left:{{x}}%;top:{{y}}%;width:{{w}}%;height:{{h}}%"><span class="label">{{label}}</span></div>{{/cells}}{{^cells}}<p class="empty">No files to map.</p>{{/cells}}<svg class="routes" viewBox="0 0 1080 600" preserveAspectRatio="none" aria-hidden="true">{{#routes}}<g style="--hue:{{hue}}" data-class:hl="$focus.includes(' {{tag}} ')">{{#segments}}<path class="route{{#now}} now{{/now}}" d="{{d}}"{{^now}} {{> fade}}{{/now}}/>{{/segments}}{{#stops}}<circle class="stop" cx="{{x}}" cy="{{y}}" r="5" {{> fade}}/>{{/stops}}</g>{{/routes}}</svg>{{#dots}}<span {{> hover}} class="dot {{state}}" style="--hue:{{hue}};left:{{x}}%;top:{{y}}%">{{tag}}</span>{{/dots}}</div></section>
