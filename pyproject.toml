[project]
name = "agentmap"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[tool.mutmut]
paths_to_mutate = ["agentmap/"]
# libcst 1.9.0 cannot parse t-strings, so mutmut cannot mutate render.py.
do_not_mutate = ["agentmap/render.py"]
tests_dir = ["tests/"]
pytest_add_cli_args_test_selection = ["tests/"]
