[project]
name = "agentmap"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[tool.mutmut]
paths_to_mutate = ["agentmap/"]
# The vendored Mustache engine is third-party code with its own tests.
do_not_mutate = ["agentmap/vendor/*"]
tests_dir = ["tests/"]
pytest_add_cli_args_test_selection = ["tests/"]
